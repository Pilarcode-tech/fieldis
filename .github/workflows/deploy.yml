name: Deploy Fieldis

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/pilarcode-tech/fieldis-api:latest

      - name: Deploy no servidor via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 77.37.41.218
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 10m
          script: |
            # Login no registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u euhenriquefranca --password-stdin

            # Garantir que a rede existe
            docker network create traefik_default 2>/dev/null || true

            # Pull da nova imagem
            docker pull ghcr.io/pilarcode-tech/fieldis-api:latest

            # Recriar apenas o container da API
            cd /opt/fieldis
            docker compose up -d --force-recreate --no-deps api

            # Verificar se subiu
            sleep 5
            docker ps | grep fieldis-api
