version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldis_user
      POSTGRES_PASSWORD: fieldis_pass
      POSTGRES_DB: fieldis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/rls-setup.sql:/docker-entrypoint-initdb.d/02-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldis_user -d fieldis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
